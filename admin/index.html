<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>portfolio · admin</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%230b0e13"/><circle cx="32" cy="32" r="13" fill="none" stroke="%2358a6ff" stroke-width="5"/></svg>'>
<style>
/* ═══════ tokens ═══════ */
:root{
  --bg:#0b0e13; --panel:#11151c; --panel2:#161b23; --panel3:#1b212b;
  --line:#232a35; --line2:#2d3644;
  --tx:#e6edf3; --tx2:#9aa5b1; --tx3:#6e7781;
  --acc:#58a6ff; --acc-dim:#1f6feb; --ok:#3fb950; --warn:#d29922; --dang:#f85149;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --r:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--acc)}

/* ═══════ lock screen ═══════ */
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.gate-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:30px 28px}
.gate-card h1{margin:0 0 4px;font:600 16px/1.3 var(--sans)}
.gate-card .sub{margin:0 0 22px;color:var(--tx3);font:12px/1.5 var(--mono)}
.gate-card label{display:block;font:11px/1 var(--mono);color:var(--tx2);
  text-transform:uppercase;letter-spacing:.08em;margin:0 0 7px}
.gate-card .hint{margin:14px 0 0;color:var(--tx3);font-size:12px;line-height:1.55}
.gate-err{margin:12px 0 0;color:var(--dang);font:12px/1.4 var(--mono);min-height:16px}

/* ═══════ chrome ═══════ */
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{display:flex;align-items:center;gap:9px;font:600 13px/1 var(--mono);letter-spacing:.02em}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 3px rgba(88,166,255,.15);font-style:normal}
.top .sp{flex:1}
.dirty{font:11px/1 var(--mono);color:var(--warn);display:none;align-items:center;gap:6px}
.dirty.on{display:flex}
.dirty::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.saved{font:11px/1 var(--mono);color:var(--tx3)}

.body{flex:1;display:flex;min-height:0}
.side{width:212px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  padding:10px 8px;overflow-y:auto}
.side .grp{font:10px/1 var(--mono);color:var(--tx3);text-transform:uppercase;
  letter-spacing:.1em;padding:14px 8px 7px}
.side button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;margin:1px 0;
  background:none;border:0;border-radius:6px;color:var(--tx2);text-align:left;cursor:pointer;
  font-size:13px}
.side button:hover{background:var(--panel3);color:var(--tx)}
.side button.on{background:var(--acc-dim);color:#fff;font-weight:500}
.side button .n{margin-left:auto;font:10px/1 var(--mono);color:var(--tx3);
  background:var(--panel3);padding:3px 6px;border-radius:20px}
.side button.on .n{background:rgba(255,255,255,.18);color:#fff}

.main{flex:1;display:flex;min-width:0}
.editor{flex:1;overflow-y:auto;padding:24px 26px 90px;min-width:0}
.editor.split{max-width:52%}
.preview{flex:1;border-left:1px solid var(--line);background:#000;display:none;
  flex-direction:column;min-width:0}
.preview.on{display:flex}
.preview .pbar{height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);font:11px/1 var(--mono);color:var(--tx3)}
.preview iframe{flex:1;width:100%;border:0;background:#0a0705}

/* ═══════ editor primitives ═══════ */
.hd{margin:0 0 3px;font:600 19px/1.3 var(--sans)}
.hd-sub{margin:0 0 24px;color:var(--tx3);font-size:13px;line-height:1.55;max-width:62ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin:0 0 14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:190px}
.f{margin:0 0 14px}
.f:last-child{margin-bottom:0}
.f label{display:block;font:11px/1 var(--mono);color:var(--tx2);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 7px}
.f label .opt{text-transform:none;letter-spacing:0;color:var(--tx3);font-size:10px}
input[type=text],input[type=url],input[type=password],textarea,select{
  width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--line2);
  border-radius:6px;outline:0;transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(88,166,255,.15)}
textarea{resize:vertical;min-height:74px;font:13px/1.6 var(--mono)}
.f .help{margin:6px 0 0;font-size:11.5px;color:var(--tx3);line-height:1.5}
.mono{font-family:var(--mono);font-size:12.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:6px;cursor:pointer;font-size:13px;
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3);border-color:#3d4757}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--acc-dim);border-color:var(--acc-dim);color:#fff;font-weight:500}
.btn.pri:hover{background:#2b7cf0;border-color:#2b7cf0}
.btn.ok{background:#1a7f37;border-color:#1a7f37;color:#fff;font-weight:500}
.btn.ok:hover{background:#208c3d}
.btn.dang{color:var(--dang);border-color:#4a2020}
.btn.dang:hover{background:#3a1a1a}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.gh{background:none;border:0;padding:5px;color:var(--tx3);border-radius:5px}
.btn.gh:hover{background:var(--panel3);color:var(--tx)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}

/* repeatable items */
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin:0 0 10px;overflow:hidden}
.item.drag{opacity:.4}
.item.over{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.item-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);
  border-bottom:1px solid var(--line);cursor:grab}
.item-h:active{cursor:grabbing}
.item.closed .item-h{border-bottom:0}
.item-h .gr{color:var(--tx3);letter-spacing:2px;font-size:12px;cursor:grab;user-select:none}
.item-h .ti{flex:1;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.item-h .ix{font:10px/1 var(--mono);color:var(--tx3);background:var(--bg);padding:3px 6px;
  border-radius:4px;border:1px solid var(--line)}
.item-b{padding:16px 14px;display:none}
.item.open .item-b{display:block}
.empty{padding:26px;text-align:center;color:var(--tx3);border:1px dashed var(--line2);
  border-radius:var(--r);font-size:13px}

/* chips / tag input */
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg);
  border:1px solid var(--line2);border-radius:6px;min-height:40px;align-items:center}
.tags:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(88,166,255,.15)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 5px 3px 9px;background:var(--panel3);
  border:1px solid var(--line2);border-radius:20px;font-size:12px;cursor:grab}
.tag.drag{opacity:.4}
.tag b{font-weight:400}
.tag button{background:none;border:0;color:var(--tx3);cursor:pointer;padding:0 2px;
  font-size:14px;line-height:1}
.tag button:hover{color:var(--dang)}
.tags input{flex:1;min-width:110px;border:0;background:none;padding:4px;outline:0;font-size:12.5px}

/* image picker */
.img{display:flex;gap:13px;align-items:flex-start}
.img .th{width:112px;height:78px;flex:0 0 auto;border-radius:6px;background:var(--bg) center/cover;
  border:1px solid var(--line2);display:grid;place-items:center;color:var(--tx3);font-size:10.5px;
  overflow:hidden}
.img .meta{flex:1;min-width:0}
.img .path{font:11.5px/1.5 var(--mono);color:var(--tx3);word-break:break-all;margin:0 0 8px}
.img .path .new{color:var(--warn)}
.gal{display:flex;gap:10px;flex-wrap:wrap}
.gal .cell{width:132px}
.gal .cell .th{width:132px;height:88px;margin:0 0 6px}
.gal .cell input{font-size:11.5px;padding:5px 7px}
.gal .cell .rm{width:100%;margin-top:5px}

/* misc */
.note{display:flex;gap:10px;padding:11px 13px;border-radius:6px;font-size:12.5px;line-height:1.55;
  margin:0 0 16px;border:1px solid}
.note.info{background:rgba(88,166,255,.07);border-color:rgba(88,166,255,.28);color:#a9cdf5}
.note.warn{background:rgba(210,153,34,.07);border-color:rgba(210,153,34,.3);color:#e0be6d}
.note b{color:inherit}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font:12px/1.5 var(--mono)}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;word-break:break-all}
.sw{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.sw input{appearance:none;width:34px;height:19px;background:var(--line2);border-radius:20px;
  position:relative;cursor:pointer;transition:background .16s;margin:0;flex:0 0 auto}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;
  border-radius:50%;background:#fff;transition:transform .16s}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{transform:translateX(15px)}
.bar{position:fixed;bottom:0;left:212px;right:0;height:56px;display:flex;align-items:center;
  gap:10px;padding:0 22px;background:rgba(17,21,28,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);z-index:20}
.bar .sp{flex:1}
.bar .st{font:11.5px/1.4 var(--mono);color:var(--tx3)}

/* toasts */
#toasts{position:fixed;bottom:70px;right:22px;display:flex;flex-direction:column;gap:8px;
  z-index:60;pointer-events:none}
.toast{padding:10px 15px;background:var(--panel3);border:1px solid var(--line2);border-radius:7px;
  font-size:13px;box-shadow:0 8px 26px rgba(0,0,0,.5);animation:tin .2s ease;max-width:390px}
.toast.ok{border-color:#1a7f37;background:#0f2d18}
.toast.err{border-color:#4a2020;background:#2d1414;color:#ffb4ae}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* modal */
dialog{border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--tx);
  padding:0;width:min(520px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.62)}
dialog .dh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600}
dialog .db{padding:20px}
dialog .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;
  justify-content:flex-end;background:var(--panel2)}
.log{font:11.5px/1.7 var(--mono);color:var(--tx2);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:11px 13px;max-height:210px;overflow:auto;white-space:pre-wrap}

@media (max-width:1100px){
  .editor.split{max-width:100%}
  .preview{display:none!important}
}
@media (max-width:760px){
  .side{position:fixed;inset:48px auto 0 0;z-index:30;transform:translateX(-100%);
    transition:transform .2s}
  .side.open{transform:none}
  .bar{left:0}
}
</style>
</head>
<body>

<!-- ═══════ lock ═══════ -->
<div id="gate">
  <form class="gate-card" id="gateForm">
    <h1 id="gateTitle">Unlock admin</h1>
    <p class="sub" id="gateSub">portfolio · content console</p>
    <div class="f">
      <label for="pw">Passphrase</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
    </div>
    <div class="f" id="pw2Wrap" hidden>
      <label for="pw2">Confirm passphrase</label>
      <input type="password" id="pw2" autocomplete="new-password">
    </div>
    <p class="gate-err" id="gateErr"></p>
    <button class="btn pri" type="submit" id="gateBtn" style="width:100%;justify-content:center">Unlock</button>
    <p class="hint" id="gateHint"></p>
  </form>
</div>

<!-- ═══════ app ═══════ -->
<div id="app" hidden>
  <header class="top">
    <span class="logo"><i></i>portfolio&nbsp;<span style="color:var(--tx3)">/</span>&nbsp;admin</span>
    <span class="sp"></span>
    <span class="dirty" id="dirty">unsaved changes</span>
    <span class="saved" id="savedAt"></span>
    <button class="btn sm" id="btnPreview">Preview</button>
    <button class="btn sm" id="btnLock">Lock</button>
  </header>

  <div class="body">
    <nav class="side" id="side"></nav>
    <div class="main">
      <div class="editor" id="editor"></div>
      <aside class="preview" id="preview">
        <div class="pbar">
          <span>live preview</span><span class="sp" style="flex:1"></span>
          <button class="btn gh" id="btnRefresh" title="Rebuild preview">↻</button>
        </div>
        <iframe id="frame" title="Preview"></iframe>
      </aside>
    </div>
  </div>

  <div class="bar">
    <button class="btn" id="btnRevert">Revert</button>
    <button class="btn" id="btnExport">Export JSON</button>
    <button class="btn" id="btnImport">Import JSON</button>
    <span class="sp"></span>
    <span class="st" id="status"></span>
    <button class="btn ok" id="btnPublish">Publish</button>
  </div>
</div>

<div id="toasts"></div>
<dialog id="modal"></dialog>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept="application/json,.json" hidden>

<script src="render.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
